name: Documentation and workspace smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scripts and a fresh workspace
        run: |
          for script in tools/submodules.sh tools/stage.sh tools/clean.sh; do
            sh -n "$script"
          done
          make help
          make status
          make clean
          test ! -e meson.build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Cache documentation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/dprint
          key: dprint-0.64.3-linux-x64
      - name: Install documentation tools
        run: |
          bash tools/install/dprint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shared documentation through Make
        run: make check
