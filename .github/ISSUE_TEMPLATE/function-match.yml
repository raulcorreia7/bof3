name: Function match request
description: Ask for work on a game function
labels: [decompilation]
body:
  - type: markdown
    attributes:
      value: |
        Function work happens in bof3-decomp. Do not attach game data.
  - type: input
    id: target
    attributes:
      label: Function and address
      description: The target image and the function name or address.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and status
      description: What you know about the function and what you tried.
    validations:
      required: true
