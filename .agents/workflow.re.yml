# The decompilation workflow as a graph: goal, spend, lanes, quality, steps and the loop that improves it.
# A coordinator walks it; each lane is one agent working one step at a time.
# Paths are relative to the workspace root. Facts about the game live in the wiki, not here.

version: 2

goal:
  match: every game function is MATCH or HAND_ASM; `meson compile -C build/meson disc` matches every disc checksum
  source: the C reads as its 1997 authors wrote it (see quality); no func_, D_, unk_ or mechanical name left where evidence gives one
  measure: decomp/build/report.json game category (matched_functions / total_functions); the counts in quality.measure
  stop:
    - goal met
    - no lane merged a MATCH in its last 3 rounds (report to the owner, do not spin)

spend:  # every rule here came from a measured round; .agents/bin/yield.py is the table
  agents: at most 4 at once (2-3 matching, 1-2 quality); the coordinator lands PRs with scripts, not agents
  round: a fresh agent per round (a resumed one pays for its history); budget about 200 tool calls
  stop_lane: 2 rounds with no MATCH, or 60 calls with none inside a round
  worktree: one per lane, a new branch per PR (a new worktree costs a full build)
  route: by class of work, to the model with the best matches per 100k tokens in the ledger for that class
  script_first: a step with no judgment in it is a script (.agents/bin), never a model
  permuter: 10 minutes at most per run by default, on one named near miss; longer only when the owner asks (9 long runs matched nothing)
  off: [naming-only lanes with no code reading, Sonnet on stubs and near misses (0 of 3 rounds)]

roles:
  coordinator: { does: "start and stop lanes, land PRs, ledger, lessons, plan", effort: medium }
  matcher-strong: { model: opus, effort: medium, does: "wrong-body and far-off drafts rewritten from the asm, jump tables, scenario, stubs" }
  matcher-twin: { model: fable, effort: medium, does: "twin groups and the hardest near misses; names the compiler pass first" }
  quality: { model: sonnet, effort: high, does: "byte-gated sweeps with a rule: SDK macros, duplicate folds, helpers, structs for offsets" }
  namer: { model: sonnet, effort: high, does: "names and types per family from reading the code; unique bodies first" }
  external: { does: "lanes on other harnesses and quotas (Codex, omp with a DeepSeek flash model) through herdr: near misses for the stronger, mechanical byte-gated folds for the cheaper", briefs: .agents/briefs }
  auditor: { does: "cross-checks a family's names against owner, callers and retail use; never the model that named it" }

lanes:  # split by image group or row class so no two lanes share a file
  s1: { role: matcher-strong, rows: [drafts with a matched twin, WRONG-BODY, STUB, SUSPECT, stub and undrafted], images: "emi/scenario and emi/boss first" }
  t1: { role: matcher-twin, rows: [kind twin] }
  q1: { role: quality, rows: one family of work per round, owns: [include/, "*.h"] }
  n1: { role: namer, starts: after the duplicate folds of its family }

quality:  # what "as the original" means; at match time and in the quality lanes
  rules:
    - SDK first: the PsyQ macros and types wherever they exist (getTPage, setRGB*, setXY*, setUV*, setWH, setPolyFT4, addPrim, setRECT, setVector, gte_*, SVECTOR, RECT); open-coded only where the bytes differ, with a note
    - rectangles are rectangles: a quad whose corners are x, y, x + w, y + h is setXYWH and setUVWH, a RECT is setRECT, a clut is getClut, blending is setSemiTrans; in-place adjusts (prim->y0 += 2) follow the macro; the macro's store order and its re-evaluated arguments are the first lever for a sched or reload difference in a drawing function
    - no steering locals: a local that only copies an argument at another width (left, top, width_u) is a wrong parameter type or a missing macro; fix that before keeping it
    - structs, not offsets: a member, an array element or a typed global; no FIELD(), MEM() or cast with + 0xNN
    - records, not scalars: locals that walk one record are a typed pointer; a word shifted apart is a struct of bytes or bit-fields
    - typed strides: the array or pointer has its element type; `i * sizeof(Type)` only where byte math must stay; never a literal size
    - a FAKE_ helper is first a wrong type: try the SDK type and the plain widths before keeping a pin (u16 tpage replaced a FAKE_REG)
    - organic names: what the thing is to the game or the SDK; never tmp10, var_s0, new_var, value2, a constant named by its value, or a name that records how the code matched
    - owner-first prefix: the module the code is linked in; the subsystem is the first word after it (docs/naming.md)
    - one body per repeated function (src/shared), one declaration per symbol in its owner header
    - no magic: a macro or helper says what you get in its name, takes everything it uses as an argument, has no hidden side effect, and never gives a thing a second noun (TASK(PartyMember), not BATTLE_WORK)
    - an offset lives with its owner as a struct: the unit, else the module header; only hardware facts live in include/psx
    - one-line what-comment on every symbol; comments on game code are kept
  at_match: [a name only with evidence, else keep func_/D_, a missing type or prototype becomes a needs line, keep the function in its file and unit]
  measure: [open functions, func_ definitions, D_ globals, unk_ members, FAKE_ uses, FIELD/MEM/cast sites, literal strides, mechanical locals]
  at_100: [module units and headers at the proven object boundaries, docs/subsystems.md and each module's interface against the tree]

improve:  # the loop: every round changes the workflow, not only the code
  after_each_round:
    - read one landed match per lane against quality.rules; a draft or match that open-codes an SDK form or steers registers with copies goes back to its lane with the form to try
    - ledger: yield.py add <lane> <round> <model> <effort> <class> <matches> <calls> <ktokens>
    - route: a class whose best model matched nothing in 2 rounds goes to the next model up, or parks with its named cause
    - claims: release the claims of a stopped lane
    - plan: update the state file (tracks, counts, next)
  lessons:  # each finding moves one level toward the gate
    - a tactic that closed a function: a row in docs/matching.md, in the same PR
    - the same miss in 2 rounds: a rule in the decomp skill (references/match.md, name.md, review.md)
    - a rule broken twice after it was written: a check in pre-push with a shrink-only allowlist
    - a coordinator step done by hand twice: a script in .agents/bin
    - a check or script that never fires in a week of rounds: delete it
  after_each_landing: [publish (the status site follows main), remove landed worktrees]
  every_25_match_prs: [disc check, pins]

review:  # by exception; everything else merges on the gate and CI
  coordinator_reads:
    - a PR that changes include/, a header, tools/, meson.build or config/ other than symbols and attempts
    - any new FAKE_ helper, register pin or Match-Removed line
    - one match PR in ten, at random
  blocks_on: [a MATCH not confirmed by image_check, a name without evidence, a rename that is not whole, a lost comment]

rules:  # each exists because breaking it cost the project before
  - Never read or use another decompilation of this game.
  - Never rm under build/; delete nothing outside the lane's worktree.
  - Never amend, force-push or rebase; integrate main with git merge.
  - Append attempts rows (tools/attempts.py add, one file per branch); never edit or delete one; never delete a draft.
  - No cleanup may lose a MATCH; Match-Removed only with an owner decision.
  - Target maps (splat rows other than a jump table's own .rodata row, symbol boundaries) and compiler config change only with an owner decision.
  - Commits and PR bodies follow the repo template (What, Why, Checks); no model or tool names, no Co-authored-by.
  - Stop a process only by its PID; write logs with >| (noclobber).
  - Push every gated commit at once; one bounded wait per PR; no interim status reports.

commands:
  worktree: decomp/tools/worktree.sh --from decomp --dir .worktrees/<lane> match/<lane>-<mmdd>
  queue: decomp/tools/worklist.py --image <glob>... --order strategy --measure   # open functions with their cause
  claim: .agents/bin/claim.sh <lane> <target>@0x<ADDR>   # exit 1: another lane holds it
  measure: decomp/tools/match.sh <target>@0x<ADDR> --diff   # passes a wrong jump table: not a proof
  image_check: BOF3_CC_CACHE=0 meson compile -C build/meson check-<image>   # the only proof of a match
  near_miss: decomp/tools/near_miss.sh <target>@0x<ADDR> <src.c> 300   # opcode diff, then a permuter run; 600 at most
  attempt: decomp/tools/attempts.py add --function <ref> --tried TEXT   # writes config/attempts/<branch>.jsonl
  gate: meson compile -C build/meson pre-push >| build/gate.log 2>&1   # ends "pre-push: all checks passed"
  land: .agents/bin/land.sh <worktree> <branch> <pr>...   # PRs one at a time
  rename_merge: .agents/bin/rename-merge.py   # merge main into a rename branch: main's bodies, the branch's names
  unpin: .agents/bin/unpin.py   # plain typed forms for every FAKE_REG
  primfold: .agents/bin/primfold.py   # runs of raw primitive stores into the SDK macros, where the bytes stay
  yield: .agents/bin/yield.py   # matches per 100k tokens by model and class
  publish: .agents/bin/publish.sh <disc worktree>   # report to the status site when the matched count changed
  lane: .agents/bin/lane.sh <herdr workspace> <name> <kind> <brief> <prompt> [-- agent args]   # a lane on another harness (.agents/briefs)
  report: meson compile -C build/meson report

steps:
  refresh:
    by: coordinator
    run: [land open PRs, report, queue, yield, pick the lanes for the next round]
    next: [pick]
  pick:
    by: lane
    run: [queue, claim]
    next: { claimed: check-body, held: pick, empty: idle }
  check-body:  # before any tuning
    run: compare the draft's size, callees, globals and constants with the target asm
    next: { same function: classify, another function or a stub: lift }
  classify:
    by: lane
    run: [measure]
    next:  # the first difference decides the tactic; see tactics
      nocompile: repair
      unit-order: size-first-draft
      sched: near-miss
      regalloc: near-miss
      frame: near-miss
      shape: shape
      match: verify
  repair: { run: rebuild the draft on the current headers, next: classify }
  size-first-draft: { run: match the earliest wrong-sized draft in the same object first, next: classify }
  lift: { run: [seed.py, read asm.s and hints.md, write the body from the asm with quality.rules], next: classify }
  near-miss: { run: [name the compiler pass (rtl_dump.sh, alloc_priority.py), tactics], next: { better: classify, stuck: park } }
  shape: { run: [opcode_diff.py top-down, tactics by hunk label], next: { better: classify, stuck: park } }
  verify:
    run: [image_check, a jump-table function in its own unit with its .rodata row, coddog match for twins]
    next: { pass: polish, fail: classify }
  polish:  # the match is the safety net: each change is kept only while match.sh still says match
    by: the lane that matched it, in the same PR
    run:
      - records for scalars: a run of locals that walk one record becomes a typed pointer or struct; a word read and shifted by 8/16/24 is a struct of bytes or bit-fields; base + 0xNN is a member; i * N is an index
      - the SDK macro and type for each primitive, vector and page word
      - each local, constant and case label named for what it is; one meaning per name
      - each FAKE_ helper retried with the plain typed forms
      - the function's name and one-line comment from what the polished body shows
    stop: 3 tries per item; what must stay raw keeps a one-line note with the cause
    next: batch
  park:
    run: keep the closest NON_MATCHING draft and add one attempts row with the cause
    when: 3 structurally different tries leave it no closer
    next: { twin or within 10% of retail: handoff, else: pick }
  handoff: { to: t1, next: pick }
  batch:
    when: 3 to 6 matches, or one batch of drafts
    run: [merge main, format, commit, gate, push, PR with auto-merge, new tactics into docs/matching.md]
    next: { merged: pick, failed: fix }
  fix: { run: read build/pre-push/<check>.log, fix, gate again, next: batch }
  idle: { by: coordinator, run: improve.after_each_round, next: [refresh] }
  quality-round:
    by: q1
    run: [count sites first, convert per site, image_check, revert a site whose bytes change and list its cause, one PR per family under 2000 lines, net lines not up]
    next: [refresh]
  name-round:
    by: n1
    run: [one family, unique bodies first, evidence per name, symbol.py rename to every copy, audit by another model]
    next: [refresh]

order:  # highest measured matches per token first
  - drafts whose twin already matches
  - wrong-body and stub drafts, written from the asm
  - twin groups (one match frees every copy)
  - unblock: wrong-sized first drafts per object, callees with many open callers
  - near misses by cause: frame, then shape, sched, regalloc
  - parked rows, with the tactics found since

tactics:  # first difference -> tries in order; the full table is decomp/docs/matching.md
  nocompile: read the error; rebuild the draft on the current header
  unit-order: size the first draft in the object, then measure the rest
  frame: count saved s registers; a callee buffer u8 scratch[N]; local count and widths; s16 copies of s32 arguments; rtl_dump.sh last
  shape: missing load -> struct member; extra lui -> pointer local p = &G; branch -> switch, do-while or goto; constant -> u8 local or width cast
  prim: a run of primitive member stores -> the SDK macro with that store order (setXYWH, setUVWH, setXY4, setUV4, setRGB0, setRECT), arguments as plain expressions on the parameters
  sched: statement order (try_variants.py), a constant into a local before a global store, member vs raw global, counter into its branch
  regalloc: alloc_priority.py on the swapped values; move a last use; one local per value; declaration order; the value's SDK type
  branch: do-while vs for; inverted if/else; switch case order; each arm its own call
  type: the SDK type first; else a needs line, never a cast
